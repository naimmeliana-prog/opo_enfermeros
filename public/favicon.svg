<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Medical Teal & Cyan energetic gradient -->
    <linearGradient id="oposanitatCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="valenciaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <!-- Soft inner shadow filter for depth -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f766e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Greek Medical Cross full-bleed without background, optimized for 100x100 space -->
  <path
    d="M 33 0 
       L 67 0 
       A 5 5 0 0 1 72 5
       L 72 28 
       A 5 5 0 0 0 77 33
       L 95 33 
       A 5 5 0 0 1 100 38
       L 100 62 
       A 5 5 0 0 1 95 67
       L 77 67 
       A 5 5 0 0 0 72 72
       L 72 95 
       A 5 5 0 0 1 67 100
       L 33 100 
       A 5 5 0 0 1 28 95
       L 28 72 
       A 5 5 0 0 0 23 67
       L 5 67 
       A 5 5 0 0 1 0 62
       L 0 38 
       A 5 5 0 0 1 5 33
       L 23 33 
       A 5 5 0 0 0 28 28
       L 28 5 
       A 5 5 0 0 1 33 0 Z"
    fill="url(#oposanitatCrossGrad)"
    filter="url(#glow)"
  />

  <!-- Stylized Nursing Stethoscope / Lifeline Pulse in pure white and gold inside the cross -->
  <!-- Center Heart & Pulse EKG Line -->
  <path
    d="M 12 50 
       L 34 50 
       L 42 34 
       L 52 66 
       L 60 42 
       L 66 52 
       L 70 50 
       L 88 50"
    fill="none"
    stroke="#ffffff"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central golden nursing flame / laurel spark -->
  <circle cx="50" cy="22" r="5" fill="url(#valenciaGoldGrad)" />
  <circle cx="50" cy="78" r="5" fill="#ffffff" opacity="0.9" />
</svg>
